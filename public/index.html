<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>당신의 술잔에 독배를 — 프로토타입</title>
<link rel="stylesheet" href="style.css" />
</head>
<body>
  <header class="topbar">
    <h1><span class="crownIcon"><svg viewBox="0 0 32 32" aria-hidden="true">
      <ellipse class="goblet" cx="16" cy="8" rx="11.6" ry="2.2"/>
      <path class="goblet" d="M4.4,8.4 L27.6,8.4 L18.2,22 L13.8,22 Z"/>
      <path class="goblet" d="M16,22 L16,26.8"/>
      <ellipse class="goblet" cx="16" cy="27.6" rx="6.2" ry="1.6"/>
      <path class="drip" d="M6.4,15 C5.4,17 5.5,18.8 6.6,18.8 C7.7,18.8 7.4,17 6.4,15 Z"/>
      <circle class="goblet-fill" cx="16" cy="14" r="3.3"/>
      <ellipse class="cut" cx="14.4" cy="13.2" rx="0.8" ry="1"/>
      <ellipse class="cut" cx="17.6" cy="13.2" rx="0.8" ry="1"/>
      <rect class="cut" x="14.7" y="15.5" width="2.6" height="0.9" rx="0.3"/>
    </svg></span><span class="titleGlow">당신의 술잔에 독배를</span><span class="ver">— 왕위를 건 형제의 밀실 암투 (밸런스 테스트)</span></h1>
    <div id="statusBar" class="statusBar"></div>
  </header>

  <main id="app">
    <section id="lobby" class="panel center">
      <p>서버에 접속 중...</p>
    </section>
  </main>

  <footer>
    <div id="log" class="log"></div>
    <div class="adminRow">
      <button id="btnReset" class="ghost">전체 초기화(관리자)</button>
      <button id="btnEnd" class="ghost">즉시 종료(관리자)</button>
    </div>
  </footer>

  <script src="/socket.io/socket.io.js"></script>
  <script src="client.js"></script>
</body>
</html>
